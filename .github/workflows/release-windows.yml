name: Publish Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build installer and portable release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Rust adapter
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer and create draft release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Knox Atlas v__VERSION__
          releaseBody: |
            ## 🗺️ Welcome to Knox Atlas

            Knox Atlas is a read-only companion map for Project Zomboid. It presents an interactive atlas from the game data installed on your computer.

            ### ✨ Highlights

            - Explore towns, streets, businesses, buildings, landmarks, and waterways.
            - Search by name or jump directly to X/Y coordinates.
            - Filter businesses, likely-loot zones, building types, and vehicle spawn pools.
            - Save named, color-coded custom markers.
            - Measure multi-point distances and save named, color-coded paths.
            - Copy coordinates and save a preferred map view.
            - See the active local game folder or choose another Project Zomboid installation.

            Knox Atlas does not edit Project Zomboid or its save files. Some layers represent game-authored zones and possible spawn locations rather than confirmed live loot, vehicles, or player positions.

            ### 📍 Waypoints and paths

            Click a location to inspect and copy its coordinates or save a named, color-coded waypoint. Saved places can be focused, renamed, recolored, or removed from the **Your Map** card.

            Choose the ruler tool to measure a route through as many points as needed. Knox Atlas totals the direct tile distance of each segment, and the finished measurement can be saved locally as a named, color-coded path for later.

            ![Named waypoints and a saved multi-point path in Knox Atlas](https://raw.githubusercontent.com/TheMysticTurtle/Knox-Atlas/main/docs/images/knox-atlas-markers-paths.png)

            ### 🧭 Filters and map layers

            The left panel separates orientation, buildings, businesses, likely-loot hints, resources, and drivable vehicle pools. Expand a category to choose individual types—for example, particular gas-station brands or medical activity zones—without hiding the rest of the basemap.

            ![Expanded business, medical, and fuel filters in Knox Atlas](https://raw.githubusercontent.com/TheMysticTurtle/Knox-Atlas/main/docs/images/knox-atlas-filters.png)

            ### 📂 Choosing the game installation

            Knox Atlas first checks the standard Steam installation and Steam's configured library folders. The usual Windows location is `C:\Program Files (x86)\Steam\steamapps\common\ProjectZomboid`.

            If the game is elsewhere—or you want Knox Atlas to read a different installation—click **Local game source** in the lower-left corner. Choose the `ProjectZomboid` folder itself and click **Select Folder**. The correct folder contains `projectzomboid.jar` and the `media` directory. Knox Atlas validates and remembers the selection without changing the game files.

            ![Choosing the ProjectZomboid installation folder from the Local game source card](https://raw.githubusercontent.com/TheMysticTurtle/Knox-Atlas/main/docs/images/knox-atlas-game-source.png)

            ### 📦 Downloads

            - **Windows installer:** Run the setup EXE and follow the Windows prompts.
            - **Portable ZIP:** Extract the ZIP into a writable folder and run `Knox-Atlas.exe`. Microsoft WebView2 must already be installed; use Microsoft's [official WebView2 Runtime page](https://developer.microsoft.com/en-us/microsoft-edge/webview2/) if needed.

            Markers, saved paths, the preferred view, and the selected game folder persist for the current Windows account under `%LOCALAPPDATA%\com.pzcompanion.map`. They are separate from the portable folder, so replacing that folder does not normally erase them. The [portable guide](https://github.com/TheMysticTurtle/Knox-Atlas/blob/main/docs/portable.md) includes runtime check commands and best-effort backup notes.

            ### Vortex

            On Nexus Mods, use **Manual Download** and extract the portable ZIP normally. In Vortex, open **Dashboard → Add Tool**, set **Target** to `Knox-Atlas.exe`, confirm **Start In** is its extracted folder, name it **Knox Atlas**, and save. Do not deploy the ZIP into the Project Zomboid game or Mods folder. See the [Vortex guide](https://github.com/TheMysticTurtle/Knox-Atlas/blob/main/docs/vortex.md).

            ### 🛡️ Windows notice

            These builds are not code-signed, so Windows SmartScreen may display an **Unknown publisher** warning.

            ### 📄 Source

            The [source code and automated build workflow](https://github.com/TheMysticTurtle/Knox-Atlas) are available for inspection under the [PolyForm Strict License 1.0.0](https://github.com/TheMysticTurtle/Knox-Atlas/blob/main/LICENSE). GitHub also provides source ZIP and TAR archives with the published release.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: --bundles nsis
          releaseAssetNamePattern: Knox-Atlas-[version]-Windows-[arch][setup].[ext]

      - name: Prepare installer release asset
        shell: powershell
        run: |
          $installerDirectory = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -LiteralPath $installerDirectory -Filter "*.exe" -File)

          if ($installers.Count -ne 1) {
            $found = ($installers.FullName -join ", ")
            throw "Expected exactly one NSIS installer in $installerDirectory; found $($installers.Count): $found"
          }

          $assetName = "Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-setup.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $assetName -Force

      - name: Package best-effort portable build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .release/portable -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/knox-atlas.exe -Destination .release/portable/Knox-Atlas.exe
          Copy-Item -LiteralPath packaging/PORTABLE-NOTES.txt -Destination .release/portable/README.txt
          Copy-Item -LiteralPath LICENSE -Destination .release/portable/LICENSE.txt
          $assetName = "Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-portable.zip"
          Compress-Archive -Path .release/portable/* -DestinationPath $assetName -Force

      - name: Upload installer workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-installer
          path: Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-setup.exe
          if-no-files-found: error

      - name: Upload portable workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-portable
          path: Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-portable.zip
          if-no-files-found: error

      - name: Add installer to draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.tauri.outputs.appVersion }}" "Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-setup.exe" --clobber

      - name: Add portable archive to draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.tauri.outputs.appVersion }}" "Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-portable.zip" --clobber
