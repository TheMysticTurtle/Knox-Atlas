name: Publish Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build installer and portable release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Rust adapter
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer and create draft release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Knox Atlas v__VERSION__
          releaseBody: |
            Knox Atlas is a read-only Project Zomboid interactive map and companion atlas built from the game data installed on your computer.

            The installer is the recommended download. The portable archive is best-effort and requires the Microsoft WebView2 runtime already present on the computer.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: --bundles nsis
          releaseAssetNamePattern: Knox-Atlas-[version]-Windows-[arch][setup].[ext]

      - name: Prepare installer release asset
        shell: powershell
        run: |
          $installerDirectory = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -LiteralPath $installerDirectory -Filter "*.exe" -File)

          if ($installers.Count -ne 1) {
            $found = ($installers.FullName -join ", ")
            throw "Expected exactly one NSIS installer in $installerDirectory; found $($installers.Count): $found"
          }

          $assetName = "Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-setup.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $assetName -Force

      - name: Package best-effort portable build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .release/portable -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/knox-atlas.exe -Destination .release/portable/Knox-Atlas.exe
          Copy-Item -LiteralPath packaging/PORTABLE-NOTES.txt -Destination .release/portable/README.txt
          $assetName = "Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-portable.zip"
          Compress-Archive -Path .release/portable/* -DestinationPath $assetName -Force

      - name: Upload installer workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-installer
          path: Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-setup.exe
          if-no-files-found: error

      - name: Upload portable workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-portable
          path: Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-portable.zip
          if-no-files-found: error

      - name: Add installer to draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.tauri.outputs.appVersion }}" "Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-setup.exe" --clobber

      - name: Add portable archive to draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.tauri.outputs.appVersion }}" "Knox-Atlas-${{ steps.tauri.outputs.appVersion }}-Windows-x64-portable.zip" --clobber
