[package]
name = "knox-atlas-core"
version = "0.2.0"
edition = "2021"
license = "PolyForm-Strict-1.0.0"
description = "Knox Atlas shared core: coordinate model, types, and Project Zomboid parsers/decoders"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.38"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
