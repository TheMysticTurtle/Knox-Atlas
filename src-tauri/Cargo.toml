[package]
name = "knox-atlas"
version = "0.2.0"
description = "A read-only Project Zomboid interactive map and companion atlas"
authors = ["Knox Atlas contributors"]
license = "PolyForm-Strict-1.0.0"
edition = "2021"

[lib]
# `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows).
name = "knox_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
knox-atlas-core = { path = "../crates/core" }
